<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#6366f1">
  <title>Sin Conexión - Lunele</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
    }

    /* Background orbs */
    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      opacity: 0.15;
    }
    .bg-orb-1 {
      width: 300px; height: 300px;
      background: #6366f1;
      top: -100px; right: -80px;
      animation: float 8s ease-in-out infinite;
    }
    .bg-orb-2 {
      width: 250px; height: 250px;
      background: #22d3ee;
      bottom: -80px; left: -60px;
      animation: float 10s ease-in-out infinite reverse;
    }
    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(20px, -20px); }
    }

    .container {
      text-align: center;
      max-width: 380px;
      position: relative;
      z-index: 1;
      animation: fadeInUp 0.6s ease-out;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .icon-wrapper {
      width: 96px; height: 96px;
      margin: 0 auto 28px;
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(99,102,241,0.15) 0%, rgba(34,211,238,0.1) 100%);
      border: 1px solid rgba(99,102,241,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .icon-wrapper::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 32px;
      border: 1px solid rgba(99,102,241,0.08);
    }

    .wifi-icon {
      width: 44px; height: 44px;
      position: relative;
    }
    .wifi-icon svg {
      width: 100%; height: 100%;
      color: #818cf8;
    }
    .wifi-slash {
      position: absolute;
      top: 50%; left: 50%;
      width: 56px; height: 3px;
      background: #ef4444;
      border-radius: 2px;
      transform: translate(-50%, -50%) rotate(-45deg);
      box-shadow: 0 0 8px rgba(239,68,68,0.4);
    }

    .title {
      font-size: 1.375rem;
      font-weight: 700;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #c7d2fe 0%, #a5b4fc 50%, #67e8f9 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .description {
      font-size: 0.875rem;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 32px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #6366f1 0%, #818cf8 100%);
      color: white;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 8px 24px rgba(99,102,241,0.25);
    }
    .retry-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(99,102,241,0.35);
    }
    .retry-btn:active {
      transform: scale(0.97);
    }

    .brand {
      margin-top: 48px;
      font-size: 0.75rem;
      color: #334155;
      font-weight: 500;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>

  <div class="container">
    <div class="icon-wrapper">
      <div class="wifi-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.288 15.038a5.25 5.25 0 0 1 7.424 0M5.106 11.856c3.807-3.808 9.98-3.808 13.788 0M1.924 8.674c5.565-5.565 14.587-5.565 20.152 0M12.53 18.22l-.53.53-.53-.53a.75.75 0 0 1 1.06 0Z" />
        </svg>
        <div class="wifi-slash"></div>
      </div>
    </div>

    <h1 class="title">Sin conexión a Internet</h1>
    <p class="description">
      No se pudo conectar con el servidor.<br>
      Verifica tu conexión a Internet e intenta de nuevo.
    </p>

    <button class="retry-btn" onclick="window.location.reload()">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182" />
      </svg>
      Reintentar
    </button>

    <p class="brand">LUNELE</p>
  </div>

</body>
</html>
